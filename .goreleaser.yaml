version: 2
project_name: orca-agent

before:
  hooks:
    - go mod download

builds:
  - id: orca
    main: ./cmd/orca
    binary: orca
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: orca
    ids: [orca]
    name_template: "orca-agent-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

homebrew_casks:
  - name: orca-agent
    ids: [orca]
    # Prereleases (v*-rc*) must not update the stable tap; brew has no separate
    # prerelease channel, so a pushed rc cask becomes the default `brew install`.
    # npm is a separate line (release-npm.yml, `npm-v*`), so an npm prerelease no
    # longer drags brew along — a stable `v*` cask can ship while npm stays on rc.
    skip_upload: "auto"
    repository:
      owner: esengine
      name: homebrew-orca
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/nanbo0ne/O.R.C.A-for-Windows"
    description: "Open Reasoning & Computing Agent for the terminal."
    commit_author:
      name: orca-agent
      email: orca@users.noreply.github.com
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/orca"]
          end

release:
  prerelease: auto
  name_template: "O.R.C.A CLI {{ .Tag }}"
